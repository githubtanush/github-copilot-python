<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Sudoku Game</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>Sudoku Master</h1>
            <button id="themeToggleBtn" class="btn btn-secondary" aria-label="Toggle light and dark mode">🌓 Theme</button>
        </header>

        <!-- Controls Toolbar -->
        <div class="controls-panel">
            <div class="control-group">
                <label for="difficultySelect">Difficulty:</label>
                <select id="difficultySelect" class="dropdown">
                    <option value="easy">Easy</option>
                    <option value="medium" selected>Medium</option>
                    <option value="hard">Hard</option>
                </select>
                <button id="newGameBtn" class="btn btn-primary">New Game</button>
            </div>

            <div class="timer-badge">
                <span>⏱ Time: </span>
                <span id="timerDisplay">00:00</span>
            </div>

            <div class="action-buttons">
                <button id="checkBtn" class="btn btn-warning">Check Solution</button>
                <button id="hintBtn" class="btn btn-info">Hint</button>
            </div>
        </div>

        <!-- Feedback Message -->
        <div id="statusMessage" class="status-message" aria-live="polite"></div>

        <!-- 9x9 Sudoku Grid -->
        <main class="grid-wrapper">
            <div id="sudokuGrid" class="sudoku-grid" role="grid" aria-label="Sudoku Grid"></div>
        </main>

        <!-- Top 10 Leaderboard -->
        <section class="leaderboard-section">
            <h2>🏆 Top 10 Fastest Times</h2>
            <div class="table-responsive">
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Player</th>
                            <th>Time</th>
                            <th>Difficulty</th>
                            <th>Hints Used</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody">
                        <!-- Dynamic Leaderboard entries -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
